[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-pilot"
version = "0.1.0"
description = "Controlled image-text evidence revision pilot"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
evidence-pilot = "evidence_pilot.cli:main"

[tool.setuptools.packages.find]
include = ["evidence_pilot*"]
